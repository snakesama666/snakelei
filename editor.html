<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IgnitronDev — 可视化 UI 编辑器</title>
<style>
:root{--bg:#0e0f11;--panel:#15171b;--panel2:#1b1e23;--fg:#F5F6F7;--muted:#8A93A6;--faint:#666e7c;
  --blue:#1B4DFF;--blue2:#9DB4FF;--pink:#FF7BA9;--line:rgba(255,255,255,.10);--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 Inter,"Microsoft YaHei",Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:auto;min-height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;display:flex;align-items:center;gap:9px;margin-right:6px}
.brand i{width:14px;height:14px;background:var(--fg);display:block}
.tag{font:500 10px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp{display:flex;gap:4px;align-items:center;padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.02)}
.grp>span{font:500 9px var(--mono);color:var(--faint);letter-spacing:.08em;padding:0 3px}
button,.btn{font:500 11px var(--mono);letter-spacing:.03em;padding:7px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;border-radius:2px;transition:.18s;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--blue);color:var(--blue2)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#335fff}
button.danger:hover{border-color:#FF3B30;color:#FF3B30}
button:disabled{opacity:.32;cursor:not-allowed}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.mini{padding:5px 7px;font-size:10px}
main{flex:1;display:grid;grid-template-columns:310px 1fr;min-height:0}
aside{overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--panel)}
.canvas{display:flex;flex-direction:column;min-width:0;background:#0a0b0d}
.canvas-bar{height:36px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--line);font:500 10px var(--mono);color:var(--faint);letter-spacing:.07em;white-space:nowrap;overflow:hidden}
.canvas-bar b{color:var(--blue2);font-weight:600;overflow:hidden;text-overflow:ellipsis}
iframe{flex:1;width:100%;border:0;background:#111214}
.guide{flex:none;display:flex;align-items:center;gap:9px;padding:8px 12px;background:rgba(27,77,255,.16);border-bottom:1px solid rgba(27,77,255,.45);color:#cfd8ff;font-size:11.5px;line-height:1.5}
.guide b{color:#fff;white-space:nowrap}
.guide em{font-style:normal;color:var(--blue2)}
.guide button{margin-left:auto;padding:2px 7px;font-size:10px;flex:none}
.drop{border:1px dashed var(--blue);padding:16px 12px;text-align:center;color:var(--muted);cursor:pointer;background:rgba(27,77,255,.05);margin-bottom:10px}
.drop.hot{background:rgba(27,77,255,.16)}
.drop strong{display:block;color:var(--fg);font-size:13px;margin-bottom:3px}
.hint{font-size:11px;color:var(--faint);line-height:1.7}
h3{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--blue2);margin:14px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.field{margin:8px 0}
.field label{display:block;font:500 10px var(--mono);letter-spacing:.05em;color:var(--faint);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 9px;font:12px/1.5 inherit;border-radius:2px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:60px}
.field input[type=color]{height:30px;padding:2px;cursor:pointer}
.field input[type=range]{padding:0;height:20px;accent-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{display:inline-block;font:500 9px var(--mono);color:var(--blue2);background:rgba(27,77,255,.14);border:1px solid rgba(27,77,255,.35);padding:2px 6px;margin-bottom:6px;word-break:break-all}
.empty{color:var(--faint);font-size:12px;line-height:1.8}
details.lay{border:1px solid var(--line);border-radius:3px;margin-bottom:12px;background:var(--panel2)}
details.lay>summary{cursor:pointer;padding:8px 10px;font:600 10px var(--mono);letter-spacing:.1em;color:var(--blue2);list-style:none}
details.lay>summary::-webkit-details-marker{display:none}
.laylist{max-height:190px;overflow:auto;padding:0 6px 8px}
.layrow{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:2px;cursor:pointer;font-size:11px;color:var(--muted)}
.layrow:hover{background:rgba(27,77,255,.12);color:var(--fg)}
.layrow.cur{background:rgba(27,77,255,.22);color:#fff}
.layrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.layrow i{font-style:normal;font:500 9px var(--mono);opacity:.65;padding:0 3px}
.layrow i:hover{opacity:1;color:var(--blue2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 16px;font:600 12px var(--mono);z-index:99;opacity:0;transition:.25s;pointer-events:none;border-radius:2px}
.toast.on{opacity:1}
.modal{position:absolute;inset:0;background:rgba(6,7,9,.78);display:none;align-items:center;justify-content:center;z-index:120}
.modal.on{display:flex}
.card{width:min(460px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px}
.card h2{font:600 14px var(--mono);margin:0 0 14px;letter-spacing:.06em}
.card p{font-size:12px;color:var(--muted);margin:0 0 12px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;font:11px var(--mono);color:var(--muted)}
.keys b{color:var(--blue2);font-weight:500}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:220px 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <span class="brand"><i></i>IgnitronDev</span>
  <span class="tag">VISUAL UI EDITOR</span>
  <div class="tools">
    <div class="grp">
      <span>文件</span>
      <label class="btn mini" for="file" style="margin:0">载入</label>
      <input id="file" type="file" accept=".html,text/html" hidden>
      <button id="saveProj" class="mini">存工程</button>
      <button id="loadProj" class="mini">开工程</button>
      <input id="projFile" type="file" accept=".json,application/json" hidden>
      <button id="download" class="primary mini" disabled>下载 index.html</button>
    </div>
    <div class="grp">
      <span>编辑</span>
      <button id="undo" class="mini" disabled title="Ctrl+Z">撤销</button>
      <button id="redo" class="mini" disabled title="Ctrl+Shift+Z">重做</button>
      <button id="copy" class="mini" disabled title="Ctrl+C">复制</button>
      <button id="paste" class="mini" disabled title="Ctrl+V">粘贴</button>
      <button id="del" class="danger mini" disabled title="Delete">删除</button>
      <button id="parent" class="mini" disabled>选父级</button>
      <button id="reset" class="mini" disabled>还原</button>
    </div>
    <div class="grp">
      <span>插入</span>
      <button id="add" class="mini" disabled>+文本</button>
      <button id="addImg" class="mini" disabled>+图片</button>
      <button id="addVid" class="mini" disabled>+视频</button>
      <button id="addShape" class="mini" disabled>+形状</button>
    </div>
    <div class="grp" id="alignGrp">
      <span>对齐</span>
      <button class="mini" data-align="left" title="左对齐">左</button>
      <button class="mini" data-align="hcenter" title="水平居中">居中</button>
      <button class="mini" data-align="right" title="右对齐">右</button>
      <button class="mini" data-align="top" title="顶对齐">上</button>
      <button class="mini" data-align="vcenter" title="垂直居中">中</button>
      <button class="mini" data-align="bottom" title="底对齐">下</button>
      <button class="mini" data-dist="h" title="水平均分">横分</button>
      <button class="mini" data-dist="v" title="垂直均分">竖分</button>
    </div>
    <div class="grp">
      <span>视图</span>
      <button id="grid" class="mini on">网格</button>
      <button id="snap" class="mini on">吸附</button>
      <button id="zoomOut" class="mini">−</button>
      <b id="zoomVal" style="font:500 10px var(--mono);min-width:34px;text-align:center">100%</b>
      <button id="zoomIn" class="mini">+</button>
      <button id="help" class="mini" title="快捷键">?</button>
    </div>
    <button id="clear" class="mini">清缓存</button>
  </div>
</header>

<main>
  <aside>
    <div class="drop" id="drop"><strong>把 index.html 拖进来</strong><span style="font:400 10px var(--mono)">或点右上角「载入」· 只在本地处理</span></div>
    <details class="lay" id="layersBox" open><summary>图层 · LAYERS</summary><div class="laylist" id="layers"></div></details>
    <p class="hint" id="hint">点右侧文字选中；Shift+点可多选。拖蓝框移动，拖右下角改大小。蓝色=吸附参考线。</p>
    <div id="panel"></div>
  </aside>
  <section class="canvas">
    <div class="guide" id="guide"><b>怎么改：</b><span>① <em>点一下</em>右侧文字 → ② 左侧改属性 / 顶部对齐与插入 → ③ 点「下载 index.html」替换原文件</span><button id="guideClose">×</button></div>
    <div class="canvas-bar"><span>EDIT CANVAS</span><b id="selinfo">未选中</b><span id="viewinfo" style="margin-left:auto"></span><span id="dirty"></span></div>
    <iframe id="frame" title="可视化编辑画布" sandbox="allow-scripts allow-same-origin"></iframe>
  </section>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

<script>
/* ===================================================================
   State — edits[cssPath] = {css,text,key,custom,deleted}
           customs[] = {id,type,style,text,src,attrs}
           layers[path] = {name,locked,hidden}
           history[] = deep snapshot of all four structures
   =================================================================== */
const $=s=>document.querySelector(s);
const frame=$('#frame'),panel=$('#panel'),selinfo=$('#selinfo');
const KEY='ignitron_visual_editor_v2';
let src='',cfg=null,baseCfg=null,declStart=-1,declEnd=-1;
let edits={},customs=[],layers={},sel=null,customSeq=1,dirty=false,loaded=false;
let history=[],hIdx=-1,clipboard=null,histTimer=null;
let gridOn=true,snapOn=true,zoom=1,treeList=[],multiCount=0;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
function extract(t){
  const m=t.match(/const\s+CONFIG\s*=\s*\{/);if(!m)throw new Error('没有找到 CONFIG');
  const st=m.index+m[0].length-1;let d=0,i=st,q=null,e=false;
  for(;i<t.length;i++){const c=t[i];
    if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}
    if(c==='"'||c==="'"||c==='`'){q=c;continue}
    if(c==='{')d++;else if(c==='}'){d--;if(!d){i++;break}}}
  return {obj:Function('"use strict";return ('+t.slice(st,i)+');')(),start:m.index,end:t.indexOf(';',i)+1};
}
function mark(){dirty=true;$('#dirty').textContent='● 未下载';$('#dirty').style.color='var(--blue2)';try{localStorage.setItem(KEY,JSON.stringify({src,cfg,edits,customs,customSeq,layers}))}catch(e){}scheduleHistory()}
let canvasReady=false,pendingMsgs=[];
function send(msg){
  const w=frame.contentWindow;if(!w){pendingMsgs.push(msg);return}
  if(typeof w.__canvasCmd==='function'){canvasReady=true;w.__canvasCmd(msg);return}
  pendingMsgs.push(msg);
  try{w.postMessage(msg,'*')}catch(e){}
}

/* ---------- undo / redo (debounced snapshots) ---------- */
function snapshot(){return clone({cfg,edits,customs,layers,customSeq})}
function scheduleHistory(){clearTimeout(histTimer);histTimer=setTimeout(pushHistory,420)}
function pushHistory(){
  const s=snapshot();
  if(hIdx>=0&&JSON.stringify(history[hIdx])===JSON.stringify(s))return;
  history=history.slice(0,hIdx+1);history.push(s);if(history.length>60)history.shift();hIdx=history.length-1;updateHistBtns();
}
function restore(s){cfg=clone(s.cfg);edits=clone(s.edits);customs=clone(s.customs);layers=clone(s.layers||{});customSeq=s.customSeq||1;refresh();mark();renderLayers()}
function undo(){if(hIdx<=0)return;hIdx--;restore(history[hIdx]);updateHistBtns();toast('已撤销')}
function redo(){if(hIdx>=history.length-1)return;hIdx++;restore(history[hIdx]);updateHistBtns();toast('已重做')}
function updateHistBtns(){$('#undo').disabled=hIdx<=0;$('#redo').disabled=hIdx>=history.length-1}

/* ---------- canvas runtime ---------- */
const RUNTIME=String.raw`
(function(){
  const P=window.parent, ov=document.createElement('div');
  function emit(d){try{if(P.__canvasMsg){P.__canvasMsg(d);return}}catch(e){}try{P.postMessage(d,'*')}catch(e){}}
  ov.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:2147483000';
  const grid=document.createElement('div'),gl=document.createElement('div');
  grid.style.cssText='position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:8px 8px';
  gl.style.cssText='position:absolute;inset:0;pointer-events:none';
  const box=document.createElement('div'),hd=document.createElement('div'),tag=document.createElement('div'),multiBox=document.createElement('div');
  box.style.cssText='position:absolute;display:none;border:1px solid #1B4DFF;background:rgba(27,77,255,.07);pointer-events:auto;cursor:move';
  multiBox.style.cssText='position:absolute;display:none;border:1px dashed #9DB4FF;pointer-events:none';
  hd.style.cssText='position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#1B4DFF;cursor:nwse-resize';
  tag.style.cssText='position:absolute;left:-1px;top:-19px;background:#1B4DFF;color:#fff;font:600 9px/1.5 monospace;padding:1px 6px;white-space:nowrap';
  box.append(hd,tag);ov.append(grid,gl,multiBox,box);
  function boot(){
    if(document.body&&!ov.parentNode)document.body.appendChild(ov);
    if(!document.getElementById('__edit_hint')){
      const st=document.createElement('style');st.id='__edit_hint';
      st.textContent='[data-k]:hover,[data-custom]:hover{outline:1px dashed rgba(27,77,255,.85);outline-offset:3px;cursor:text!important}[data-e-locked="1"]{pointer-events:none!important}';
      (document.head||document.body).appendChild(st);
    }
  }
  function freeze(){
    try{
      const l=document.getElementById('loader');if(l)l.remove();
      if(typeof settleAll==='function')settleAll();
      if(typeof resetEngine==='function')resetEngine();
      try{if(typeof winIO!=='undefined'&&winIO&&winIO.disconnect)winIO.disconnect()}catch(e){}
      document.querySelectorAll('.sk,.gen-box,.gen-line,.gen-deco').forEach(e=>e.remove());
      ['fxLayer','agentLayer','particles','sliceGlitch','glitchOverlay'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'});
      document.querySelectorAll('.win-hide').forEach(e=>e.classList.remove('win-hide'));
    }catch(e){emit({t:'err',m:String(e)})}
  }
  function bootAll(){boot();freeze();setTimeout(freeze,150);setTimeout(tree,320);setTimeout(function(){emit({t:'ready'})},180)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootAll);else bootAll();

  let gridOn=true,snapOn=true,zoom=1,locks={};
  function path(el){
    if(el.dataset.custom)return '[data-custom="'+el.dataset.custom+'"]';
    const a=[];let n=el;
    while(n&&n.nodeType===1&&n!==document.body){
      const p=n.parentElement;let s=n.tagName.toLowerCase();
      if(p){const sib=[...p.children].filter(c=>c.tagName===n.tagName);s+=':nth-of-type('+(sib.indexOf(n)+1)+')'}
      a.unshift(s);n=p;
    }
    return 'body > '+a.join(' > ');
  }
  function hex(c){const m=String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);if(!m)return '#f5f6f7';return '#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('')}
  function state(el){
    const c=getComputedStyle(el),r=el.getBoundingClientRect();
    return {text:el.textContent||'',fontSize:Math.round(parseFloat(c.fontSize)||16),fontFamily:c.fontFamily,color:hex(c.color),
      fontWeight:c.fontWeight,letterSpacing:Math.round(parseFloat(c.letterSpacing)||0),lineHeight:c.lineHeight,textAlign:c.textAlign,
      width:Math.round(r.width),height:Math.round(r.height),x:Math.round(parseFloat(el.style.left)||0),y:Math.round(parseFloat(el.style.top)||0),
      opacity:c.opacity,bg:hex(c.backgroundColor),radius:parseFloat(c.borderTopLeftRadius)||0,border:c.borderTopWidth,
      borderColor:hex(c.borderTopColor),shadow:c.boxShadow,zIndex:c.zIndex,fit:c.objectFit,src:el.getAttribute('src')||'',
      tag:el.tagName.toLowerCase(),type:el.tagName.toLowerCase()==='img'?'image':(el.tagName.toLowerCase()==='video'?'video':(el.dataset.custom?'text':'dom')),
      attrs:{alt:el.getAttribute('alt')||'',poster:el.getAttribute('poster')||'',autoplay:el.autoplay,loop:el.loop,muted:el.muted,controls:el.controls}};
  }
  const CSSPROPS=['font-size','font-family','color','font-weight','letter-spacing','line-height','text-align','width','height','position','left','top','display','opacity','background-color','border-radius','border','border-color','box-shadow','z-index','object-fit','padding','margin'];
  function cssOf(el){const o={};CSSPROPS.forEach(k=>{const v=el.style.getPropertyValue(k);if(v)o[k]=v});return o}
  function reportOne(el){
    const st=state(el);
    emit({t:'change',path:path(el),key:el.dataset.k||'',custom:el.dataset.custom||'',css:cssOf(el),text:st.text,styles:st});
  }
  function report(){multi.forEach(reportOne)}
  let sel=null,multi=[],drag=null;
  function bounds(){
    if(!multi.length)return null;
    let l=1e9,t=1e9,r=-1e9,b=-1e9;
    multi.forEach(e=>{const q=e.getBoundingClientRect();l=Math.min(l,q.left);t=Math.min(t,q.top);r=Math.max(r,q.right);b=Math.max(b,q.bottom)});
    return {l,t,r,b,w:r-l,h:b-t};
  }
  function draw(){
    grid.style.display=gridOn?'block':'none';
    if(!sel){box.style.display='none';multiBox.style.display='none';return}
    const q=sel.getBoundingClientRect();
    box.style.display='block';box.style.left=q.left+'px';box.style.top=q.top+'px';box.style.width=q.width+'px';box.style.height=q.height+'px';
    tag.textContent=(sel.dataset.k||sel.dataset.custom||sel.tagName.toLowerCase())+' · '+Math.round(q.width)+'x'+Math.round(q.height);
    if(multi.length>1){const b=bounds();multiBox.style.display='block';multiBox.style.left=b.l+'px';multiBox.style.top=b.t+'px';multiBox.style.width=b.w+'px';multiBox.style.height=b.h+'px'}
    else multiBox.style.display='none';
  }
  function clearGuides(){gl.innerHTML=''}
  function line(axis,at){
    const d=document.createElement('div');
    d.style.cssText='position:absolute;background:#FF7BA9;opacity:.9;pointer-events:none;'+(axis==='v'?'left:'+at+'px;top:0;bottom:0;width:1px':'top:'+at+'px;left:0;right:0;height:1px');
    gl.appendChild(d);
  }
  function targets(cur){
    const out=[];let n=0;
    const list=document.querySelectorAll('main *,header *,footer *,[data-custom]');
    for(let i=0;i<list.length;i++){
      const e=list[i];if(e===cur||e.closest('#statusbar'))continue;
      const r=e.getBoundingClientRect();
      if(r.width<12||r.height<8||r.bottom<0||r.top>innerHeight)continue;
      out.push({l:r.left,c:r.left+r.width/2,r:r.right,t:r.top,m:r.top+r.height/2,b:r.bottom});
      if(++n>50)break;
    }
    return out;
  }
  function snap(el){
    if(!snapOn)return;
    clearGuides();
    const r=el.getBoundingClientRect(),ts=targets(el);
    let bx=null,by=null;
    const xs=[r.left,r.left+r.width/2,r.right],ys=[r.top,r.top+r.height/2,r.bottom];
    let best=6;
    xs.forEach(a=>ts.forEach(t=>[t.l,t.c,t.r].forEach(v=>{const d=Math.abs(a-v);if(d<best){best=d;bx={d:v-a,at:v}}})));
    best=6;
    ys.forEach(a=>ts.forEach(t=>[t.t,t.m,t.b].forEach(v=>{const d=Math.abs(a-v);if(d<best){best=d;by={d:v-a,at:v}}})));
    const L=parseFloat(el.style.left)||0,T=parseFloat(el.style.top)||0;

/* ---------- serialization ---------- */
function rulesText(){
  const out=[];
  Object.entries(edits).forEach(([p,e])=>{
    if(e.deleted){out.push(p+'{display:none!important}');return}
    const d=Object.entries(e.css||{}).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>k+':'+v+'!important').join(';');
    if(d)out.push(p+'{'+d+'}');
  });
  Object.entries(layers).forEach(([p,l])=>{if(l.hidden)out.push(p+'{display:none!important}')});
  return out.join('\n');
}
function liveCustoms(){return customs.filter(c=>!Object.entries(edits).some(([p,e])=>p.includes(c.id)&&e.deleted))}
function customBlocks(){
  return liveCustoms().map(c=>{
    const e=Object.entries(edits).find(([p])=>p.includes(c.id));
    let st=c.style||'';
    if(e&&e[1].css)st+=';'+Object.entries(e[1].css).filter(([k,v])=>v).map(([k,v])=>k+':'+v).join(';');
    const at=(c.attrs||{});
    const src=String(c.src||'').replace(/"/g,'&quot;');
    if(c.type==='image')return '<img data-custom="'+esc(c.id)+'" src="'+src+'" alt="'+esc(at.alt||'')+'" style="'+esc(st)+'">';
    if(c.type==='video'){
      const flags=[at.controls!==false?'controls':'',at.autoplay?'autoplay':'',at.loop?'loop':'',at.muted?'muted':''].filter(Boolean).join(' ');
      return '<video data-custom="'+esc(c.id)+'" src="'+src+'" poster="'+esc(at.poster||'')+'" '+flags+' style="'+esc(st)+'"></video>';
    }
    return '<div data-custom="'+esc(c.id)+'" style="'+esc(st)+'">'+esc((e&&e[1].text)||c.text||'')+'</div>';
  }).join('\n');
}
function previewHtml(){
  let h=src;
  h=h.slice(0,declStart)+'const CONFIG = '+JSON.stringify(cfg,null,2).replace(/<\/script/gi,'<\\/script')+';'+h.slice(declEnd);
  h=h.replace('let motionPaused=false;','let motionPaused=true;');
  h=h.replace('setTimeout(()=>runBuild(introSkipped),160);','setTimeout(()=>{try{settleAll();resetEngine();winIO.disconnect()}catch(e){}},160);');
  const css=rulesText();
  if(css)h=h.replace('</head>','<style id="visual-live">\n'+css+'\n</style>\n</head>');
  const cb=customBlocks();
  if(cb)h=h.replace('</body>',cb+'\n</body>');
  h=h.replace('</body>','<script>'+RUNTIME+'<\/script></body>');
  return h;
}

  on('#p_fs','input',e=>{$('#v_fs').textContent=e.target.value+'px';apply('font-size',e.target.value+'px')});
  on('#p_ff','change',e=>{if(e.target.value)apply('font-family',e.target.value)});
  on('#p_color','input',e=>apply('color',e.target.value));
  on('#p_fw','change',e=>apply('font-weight',e.target.value));
  on('#p_ls','input',e=>apply('letter-spacing',e.target.value+'px'));
  on('#p_lh','input',e=>apply('line-height',e.target.value));
  on('#p_ta','change',e=>apply('text-align',e.target.value));
  on('#p_bg','input',e=>apply('background-color',e.target.value));
  on('#p_op','input',e=>apply('opacity',e.target.value));
  on('#p_rad','input',e=>apply('border-radius',e.target.value+'px'));
  on('#p_z','input',e=>apply('z-index',e.target.value));
  on('#p_bw','input',e=>apply('border',e.target.value+'px solid '+$('#p_bc').value));
  on('#p_bc','input',e=>apply('border-color',e.target.value));
  on('#p_shadow','click',()=>apply('box-shadow','0 12px 32px rgba(0,0,0,.45)'));
  on('#p_shadowOff','click',()=>apply('box-shadow','none'));
  on('#p_front','click',()=>apply('z-index','9999'));
  on('#p_w','input',e=>apply('width',e.target.value+'px'));
  on('#p_h','input',e=>apply('height',e.target.value+'px'));
  on('#p_x','input',e=>{apply('position','relative');apply('left',e.target.value+'px')});
  on('#p_y','input',e=>{apply('position','relative');apply('top',e.target.value+'px')});
  on('#p_parent','click',()=>send({t:'parent'}));
  on('#p_del','click',delSel);
}
function delSel(){if(!sel)return;send({t:'delete'})}

/* ---------- layers ---------- */
function renderLayers(){
  const box=$('#layers');
  if(!treeList.length){box.innerHTML='<div class="hint" style="padding:6px">载入后显示图层</div>';return}
  box.innerHTML=treeList.map((n,i)=>'<div class="layrow '+(sel&&sel.path===n.path?'cur':'')+'" data-i="'+i+'"><i>'+esc(n.tag.slice(0,3))+'</i><span title="'+esc(n.path)+'">'+esc((layers[n.path]&&layers[n.path].name)||n.name)+'</span>'+
    '<i data-act="hide" title="显示/隐藏">'+(layers[n.path]&&layers[n.path].hidden?'隐':'显')+'</i><i data-act="lock" title="锁定">'+(layers[n.path]&&layers[n.path].locked?'锁':'开')+'</i></div>').join('');
  box.querySelectorAll('.layrow').forEach(row=>row.addEventListener('click',e=>{
    const i=+row.dataset.i,n=treeList[i];if(!n)return;
    const act=e.target.dataset.act;
    if(act){e.stopPropagation();layers[n.path]=Object.assign({},layers[n.path],{[act==='hide'?'hidden':'locked']:!(layers[n.path]&&layers[n.path][act==='hide'?'hidden':'locked'])});
      if(act==='hide'){const ed=edits[n.path]||(edits[n.path]={css:{}});ed.css={};if(layers[n.path].hidden)ed.css.display='none';else delete ed.css.display}
      send({t:'view',locks:Object.fromEntries(Object.entries(layers).filter(([p,l])=>l.locked).map(([p])=>[p,1]))});
      if(act==='hide')refresh();else renderLayers();mark();return}
    send({t:'selectPath',path:n.path,add:e.shiftKey});
  }));
}

/* ---------- messages from canvas ---------- */
function handleMsg(d){
  d=d||{};if(!d.t)return;
  if(d.t==='ready'){canvasReady=true;const q=pendingMsgs.splice(0);q.forEach(send);return}
  if(d.t==='select'){
    sel=d.sel;multiCount=d.count||0;
    if(!sel){panel.innerHTML=emptyPanel();selinfo.textContent='未选中';$('#del').disabled=$('#parent').disabled=$('#copy').disabled=true;renderLayers();return}
    selinfo.textContent=(sel.key||('元素 '+(sel.custom||''))||sel.tag)+(multiCount>1?'  +'+(multiCount-1):'');
    ['del','parent','copy'].forEach(id=>$('#'+id).disabled=false);
    panel.innerHTML=panelHtml(sel);bindPanel();renderLayers();
  }else if(d.t==='change'){
    const old=edits[d.path]||{css:{}};
    edits[d.path]={css:Object.assign({},old.css,d.css||{}),text:d.key?d.text:(old.text||''),key:d.key||old.key||'',custom:d.custom||''};
    if(d.custom){const c=customs.find(x=>x.id===d.custom);if(c&&d.text!=null&&c.type==='text')c.text=d.text}
    mark();
  }else if(d.t==='deleted'){
    (d.all&&d.all.length?d.all:[d.path]).forEach(p=>edits[p]={css:{},deleted:true});
    mark();sel=null;multiCount=0;panel.innerHTML=emptyPanel();selinfo.textContent='已删除';
    ['del','parent','copy'].forEach(id=>$('#'+id).disabled=true);send({t:'tree'});
  }else if(d.t==='custom'){
    customs.push({id:d.id,type:d.type||'text',style:d.style||'',text:d.text||'',src:d.src||'',attrs:d.attrs||{}});customSeq++;mark();toast('已添加元素，可直接拖动');
  }else if(d.t==='tree'){treeList=d.list||[];renderLayers()}
  else if(d.t==='hint'){toast(d.m)}
  else if(d.t==='requestDelete'){delSel()}
  else if(d.t==='key'){shortcut(d.k,d.shift)}
  else if(d.t==='err'){console.warn('canvas:',d.m)}
}
addEventListener('message',e=>handleMsg(e.data||{}));
window.__canvasMsg=handleMsg;

/* ---------- shortcuts ---------- */
function shortcut(k,shift){
  if(k==='z'){shift?redo():undo();return}
  if(k==='y'){redo();return}
  if(k==='c'){copySel();return}
  if(k==='v'){paste();return}
  if(k==='d'){copySel();paste();return}
  if(k==='a'){send({t:'selectAll'});return}
  if(k==='s'){$('#download').click();return}
  if(k==='+'||k==='='){setZoom(zoom+0.1);return}
  if(k==='-'){setZoom(zoom-0.1);return}
  if(k==='['||k===']'){if(sel){const z=(parseInt(sel.styles&&sel.styles.zIndex)||0)+(k===']'?10:-10);send({t:'apply',prop:'z-index',value:String(z)})}return}
  if(k==='?'){showHelp();return}
}
addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(typing&&e.key!=='Escape')return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&['z','y','c','v','d','a','s','+','=','-','[',']'].includes(k)){e.preventDefault();shortcut(k,e.shiftKey)}
  else if(e.key==='?'){e.preventDefault();showHelp()}
  else if(e.key==='Escape'&&sel){send({t:'selectPath',path:'body'});sel=null;panel.innerHTML=emptyPanel()}
});
function copySel(){
  if(!sel)return;
  clipboard={type:(sel.styles&&sel.styles.type)||'text',css:clone((edits[sel.path]&&edits[sel.path].css)||{}),
    text:(sel.styles&&sel.styles.text)||'',src:(sel.styles&&sel.styles.src)||'',attrs:clone((sel.styles&&sel.styles.attrs)||{}),style:''};
  const c=customs.find(x=>x.id===sel.custom);if(c)clipboard.style=c.style;
  $('#paste').disabled=false;toast('已复制');
}
function paste(){
  if(!clipboard){toast('先复制一个元素');return}
  const d=clone(clipboard);d.t='add';
  if(d.css){delete d.css.left;delete d.css.top;delete d.css.position}
  if(d.style)d.style=d.style.replace(/left:\s*[\d.]+px/,'left:'+(120+Math.round(Math.random()*60))+'px').replace(/top:\s*[\d.]+px/,'top:'+(160+Math.round(Math.random()*60))+'px');
  send(d);$('#paste').disabled=false;
}
function setZoom(z){zoom=Math.min(2,Math.max(0.4,Math.round(z*10)/10));$('#zoomVal').textContent=Math.round(zoom*100)+'%';syncView()}

/* ---------- media modal ---------- */
function openMedia(type,replace){
  const m=$('#modal');
  $('#modalCard').innerHTML='<h2>'+(type==='video'?'插入视频':'插入图片')+'</h2>'+
    '<p>可粘贴图片/视频网址，或选择本地文件（会内嵌进导出的 HTML，文件较大时建议用网址）。</p>'+
    '<div class="field"><label>来源 URL</label><input id="m_url" placeholder="https://..."></div>'+
    '<div class="field"><label>或选择本地文件</label><input type="file" id="m_file" accept="'+(type==='video'?'video/*':'image/*')+'"></div>'+
    '<div class="row"><button id="m_ok" class="primary">插入</button><button id="m_cancel">取消</button></div>';
  m.classList.add('on');
  $('#m_cancel').onclick=()=>m.classList.remove('on');
  $('#m_ok').onclick=()=>{
    const url=$('#m_url').value.trim(),f=$('#m_file').files[0];
    const done=u=>{
      if(replace&&sel)send({t:'attrs',src:u,attrs:{}});
      else send({t:'add',type,src:u,attrs:type==='video'?{controls:true,loop:false,muted:true,autoplay:false}:{alt:''}});
      m.classList.remove('on');toast('已插入，可在左侧调大小与外观');
    };
    if(f){const r=new FileReader();r.onload=()=>done(String(r.result));r.readAsDataURL(f)}
    else if(url)done(url);else toast('请填网址或选择文件');
  };
}
function showHelp(){
  const m=$('#modal');
  $('#modalCard').innerHTML='<h2>快捷键</h2><div class="keys">'+
    [['Ctrl+Z','撤销'],['Ctrl+Shift+Z / Ctrl+Y','重做'],['Ctrl+C / V','复制 / 粘贴'],['Ctrl+D','再制一份'],
     ['Ctrl+A','全选元素'],['Delete / Backspace','删除选中'],['Shift + 点击','多选'],['Esc','取消选择'],
     ['方向键','微调 1px'],['Shift + 方向键','微调 10px'],['Ctrl + / −','画布缩放'],['[ / ]','层级下调 / 上调'],
     ['Ctrl+S','下载 index.html'],['?','本帮助']].map(([a,b])=>'<div><b>'+esc(a)+'</b>　'+esc(b)+'</div>').join('')+'</div>'+
    '<div class="row"><button id="m_close" class="primary">知道了</button></div>';
  m.classList.add('on');$('#m_close').onclick=()=>m.classList.remove('on');
}

/* ---------- export ---------- */
function exportHtml(){
  if(!src)return '';
  let out=src;
  Object.values(edits).forEach(e=>{if(e.key&&e.text!=null)try{setPath(cfg,e.key,e.text)}catch(err){}});
  out=out.slice(0,declStart)+'const CONFIG = '+JSON.stringify(cfg,null,2).replace(/<\/script/gi,'<\\/script')+';'+out.slice(declEnd);
  const css=rulesText();
  if(css)out=out.replace('</head>','<style id="visual-edits">\n'+css+'\n</style>\n</head>');
  const cb=customBlocks();
  if(cb)out=out.replace('</body>',cb+'\n</body>');
  return out;
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/html;charset=utf-8'}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- file loading / toolbar ---------- */
function load(text,name){
  const r=extract(text);
  src=text;declStart=r.start;declEnd=r.end;cfg=r.obj;baseCfg=clone(cfg);
  edits={};customs=[];layers={};customSeq=1;loaded=true;history=[];hIdx=-1;
  ['add','addImg','addVid','addShape','reset','download','saveProj','loadProj','paste'].forEach(id=>$('#'+id).disabled=false);
  ['del','parent','copy'].forEach(id=>$('#'+id).disabled=true);
  refresh();pushHistory();mark();toast('已载入 '+(name||'index.html'));
}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(String(r.result),f.name);r.readAsText(f,'utf-8')});
const drop=$('#drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('click',()=>$('#file').click());
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(String(r.result),f.name);r.readAsText(f,'utf-8')});
$('#add').onclick=()=>send({t:'add',type:'text'});
$('#addImg').onclick=()=>openMedia('image',false);
$('#addVid').onclick=()=>openMedia('video',false);
$('#addShape').onclick=()=>send({t:'add',type:'shape'});
$('#del').onclick=delSel;
$('#parent').onclick=()=>send({t:'parent'});
$('#copy').onclick=copySel;
$('#paste').onclick=paste;
$('#undo').onclick=undo;
$('#redo').onclick=redo;
$('#reset').onclick=()=>{if(!baseCfg)return;cfg=clone(baseCfg);edits={};customs=[];layers={};sel=null;refresh();mark();pushHistory();toast('已还原为载入时的状态')};
$('#clear').onclick=()=>{localStorage.removeItem(KEY);toast('本机缓存已清除')};
$('#grid').onclick=e=>{gridOn=!gridOn;e.target.classList.toggle('on',gridOn);syncView()};
$('#snap').onclick=e=>{snapOn=!snapOn;e.target.classList.toggle('on',snapOn);syncView()};
$('#zoomIn').onclick=()=>setZoom(zoom+0.1);
$('#zoomOut').onclick=()=>setZoom(zoom-0.1);
$('#help').onclick=showHelp;
$('#alignGrp').addEventListener('click',e=>{
  const a=e.target.dataset.align,d=e.target.dataset.dist;
  if(a)send({t:'align',mode:a});if(d)send({t:'distribute',axis:d});
});
$('#download').onclick=()=>{const h=exportHtml();if(!h)return;download('index.html',h);dirty=false;$('#dirty').textContent='';toast('已下载，替换原 index.html 即可生效')};
$('#saveProj').onclick=()=>{if(!src)return;download('ignitron-project.json',JSON.stringify({src,cfg,edits,customs,layers,customSeq},null,2),'application/json');toast('工程已保存')};
$('#loadProj').onclick=()=>$('#projFile').click();
$('#projFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(String(r.result));if(!p.src)throw 0;load(p.src,'project');cfg=p.cfg||cfg;edits=p.edits||{};customs=p.customs||[];layers=p.layers||{};customSeq=p.customSeq||1;refresh();pushHistory();mark();toast('工程已打开')}catch(x){toast('工程文件无效')}};r.readAsText(f,'utf-8')};
$('#guideClose').onclick=()=>{$('#guide').style.display='none'};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});
panel.innerHTML=emptyPanel();renderLayers();
async function autoLoad(){
  try{const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)return false;const t=await r.text();if(!t.includes('const CONFIG'))return false;load(t,'index.html');return true}catch(e){return false}
}
(async()=>{
  let restored=false;
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved&&saved.src){
      const r=extract(saved.src);src=saved.src;declStart=r.start;declEnd=r.end;baseCfg=r.obj;
      cfg=saved.cfg||r.obj;edits=saved.edits||{};customs=saved.customs||[];layers=saved.layers||{};customSeq=saved.customSeq||1;loaded=true;
      Object.values(edits).forEach(e=>{if(e.key&&e.text!=null)try{setPath(cfg,e.key,e.text)}catch(x){}});
      ['add','addImg','addVid','addShape','reset','download','saveProj','loadProj','paste'].forEach(id=>$('#'+id).disabled=false);
      refresh();selinfo.textContent='已恢复上次编辑';restored=true;pushHistory();
    }
  }catch(e){}
  if(!restored){const ok=await autoLoad();if(!ok)selinfo.textContent='请把 index.html 拖到左侧蓝色区域，或点「载入」'}
})();
</script>
